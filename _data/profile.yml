short_bio_text_justify: false
short_bio: >-
  <p>
    Hi! I am <strong>Yanzhou Tang</strong>, a first-year CS Ph.D. student at the Georgia Institute of Technology,
    advised by <a href="https://eiclab.scs.gatech.edu/pages/team.html" target="_blank">Prof. Yingyan (Celine) Lin</a>
    in the <a href="https://eiclab.scs.gatech.edu" target="_blank">Efficient and Intelligent Computing (EIC) Lab</a>.
  </p>
  <p>
    My research interests lie broadly in <strong>computer systems</strong> and <strong>computer architecture</strong>.
    Currently, I focus on <strong>efficient agentic AI systems</strong> and <strong>efficient spatial computing systems</strong>.
  </p>
  <p>
    Before joining Georgia Tech, I had a wonderful research experience at the SAI Lab at New York University,
    where I was a research intern advised by <a href="https://www.saiqianzhang.com/" target="_blank">Prof. Sai Qian Zhang</a>
    and worked closely with <a href="https://naizhengtan.github.io/" target="_blank">Prof. Cheng Tan</a>.
    I received both my B.S. and M.S. degrees from Shanghai Jiao Tong University.
  </p>
  <p>
    I am always open to collaborations. If you are interested in my research, feel free to reach out by
    <a href="mailto:ytang614@gatech.edu">email</a>!
  </p>

